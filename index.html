<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<meta name="description" content="纯前端实现的经典坦克大战 — Canvas 2D 引擎、可破坏地形、多关卡、双人同屏。">
<title>坦克大战 · Tank Battle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1017'/><rect x='7' y='9' width='18' height='16' rx='3' fill='%23f0c24b'/><rect x='14' y='3' width='4' height='9' fill='%23f0c24b'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <main class="stage">
    <div class="screen">
      <canvas id="game" aria-label="坦克大战游戏画面"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>
  </main>

  <aside class="panel">
    <h1 class="brand">坦克大战<small>TANK BATTLE</small></h1>

    <div class="stat">
      <span class="stat-label">关卡</span>
      <span class="stat-value" id="hud-level">1</span>
    </div>
    <div class="stat">
      <span class="stat-label">分数</span>
      <span class="stat-value" id="hud-score">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">生命</span>
      <span class="stat-value" id="hud-lives">3</span>
    </div>

    <div class="unit">
      <span class="stat-label">剩余敌军</span>
      <div class="grid-icons" id="hud-enemies"></div>
    </div>

    <div class="keys">
      <div class="key-row"><b>1P</b><span>↑↓←→ 移动</span><span>空格 开火</span></div>
      <div class="key-row"><b>2P</b><span>W A S D 移动</span><span>F 开火</span></div>
      <div class="key-row"><b>—</b><span>P 暂停</span><span>M 静音</span></div>
    </div>

    <div class="legend">
      <span><i class="sw brick"></i>砖墙可打穿</span>
      <span><i class="sw steel"></i>钢墙需满级火力</span>
      <span><i class="sw water"></i>河流挡坦克</span>
      <span><i class="sw tree"></i>树林可隐蔽</span>
    </div>
  </aside>

</div>

<!-- 移动端虚拟摇杆 -->
<div class="touch" id="touch">
  <div class="dpad">
    <button data-dir="up"    aria-label="上">▲</button>
    <button data-dir="left"  aria-label="左">◀</button>
    <button data-dir="right" aria-label="右">▶</button>
    <button data-dir="down"  aria-label="下">▼</button>
  </div>
  <button class="fire" data-fire aria-label="开火">FIRE</button>
</div>

<script src="js/levels.js"></script>
<script src="js/audio.js"></script>
<script src="js/map.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
</body>
</html>
